<ion-header class="app-header">
  <ion-toolbar class="grafito-toolbar">
    <ion-title>Perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="wrap">
    <section class="user-card animate-in">
      <div class="avatar" aria-hidden="true">{{ iniciales }}</div>
      <h2>{{ nombre || usuario }}</h2>
      <span class="role">
        <ion-icon name="shield-checkmark-outline" aria-hidden="true"></ion-icon>
        Revisor CxP
      </span>
    </section>

    <section class="info-card animate-in">
      <div class="row">
        <span class="ico"><ion-icon name="person-outline" aria-hidden="true"></ion-icon></span>
        <div class="rt">
          <span class="lbl">Usuario</span>
          <span class="val">{{ usuario || '—' }}</span>
        </div>
      </div>

      @if (email) {
        <div class="row">
          <span class="ico"><ion-icon name="at-outline" aria-hidden="true"></ion-icon></span>
          <div class="rt">
            <span class="lbl">Correo</span>
            <span class="val">{{ email }}</span>
          </div>
        </div>
      }
    </section>

    <button type="button" class="logout" (click)="confirmLogout()">
      <ion-icon name="log-out-outline" aria-hidden="true"></ion-icon>
      Cerrar sesión
    </button>

    <p class="version">Versión {{ version() }}</p>
  </div>
</ion-content>
