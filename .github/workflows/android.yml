name: Build Android APK

# Compila el APK de "Revisor CxP" gratis en la nube (GitHub Actions).
# Se ejecuta en cada push a main y también manualmente (workflow_dispatch).
# El APK queda como artefacto descargable en la página del run.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web (production)
        run: npx ng build --configuration production

      - name: Capacitor sync (Android)
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: revisor-cxp-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
